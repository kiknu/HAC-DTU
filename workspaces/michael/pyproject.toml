[project]
name = "hac-asteroids"
version = "0.1.0"
description = "GPU asteroid lightcurve inversion and forward-model validation"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "embreex>=4.4.0",
    "fast-simplification>=0.1.12",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scipy>=1.15.3",
    "pathlib>=1.0.1",
    "pytorch3d",
    "torch==2.6.0",
    "trimesh>=4.12.2",
]

[project.scripts]
hac-asteroids = "hac_asteroids.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hac_asteroids"]
py-modules = [
    "forward_model",
    "forward_validation",
    "main",
    "pytorch3d_forward",
    "render_safety",
    "shape_model",
    "visualize_fit",
    "visualize_match",
]

[tool.uv.extra-build-dependencies]
pytorch3d = ["torch==2.6.0", "ninja", "numpy"]

[tool.uv.extra-build-variables]
pytorch3d = { MAX_JOBS = "4" }

[tool.uv.sources]
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "7f8a8a142fa1383a7895ed01dd7082105f9a81fb" }
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
