[project]
name = "hac"
version = "0.1.0"
description = "Code related to the Helsinki Asteroid Challenge submissions by the team from the Technical University of Denmark (DTU)."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Jeppe Klitgaard", email = "hi@jeppe.science" },
    { name = "Ishak Ayad", email = "ishak.ayad@centralesupelec.fr" }
]

dependencies = [
    # Existing project dependencies
    "jax>=0.10.1",
    "matplotlib>=3.10.9",
    "numpy",
    "numpy-stl[fast]>=4.0.0",
    "scipy",
    "seaborn>=0.13.2",
    # PyTorch and related libraries
    "torch==2.9.0",
    "torchvision==0.24.0",
    "torchaudio==2.9.0",
    "pytorch-lightning==2.5.6",
    "cupy-cuda12x",
    # Visualization
    "torchviz",
    "graphviz",
    # Hydra
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "hydra-colorlog==1.2.0",
    # Data science
    "pandas",
    "scikit-image",
    "tqdm",
    "einops==0.6.1",
    # Experiment management
    "tensorboard",
    "loguru",
    "rich",
    "huggingface-hub",
    # Utilities
    "runstats",
    "gdown",
    "nvitop",
]

[dependency-groups]
dev = [
    "ipykernel<7",
    "pytest",
    "ruff",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
