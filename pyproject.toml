[project]
name = "hac"
version = "0.1.0"
description = "Code related to the Helsinki Asteroid Challenge submissions by the team from the Technical University of Denmark (DTU)."
readme = "README.md"
authors = [
    { name = "Jeppe Klitgaard", email = "hi@jeppe.science" },
    { name = "Ishak Ayad", email = "ishak.ayad@centralesupelec.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "jax>=0.10.1",
    "matplotlib>=3.10.9",
    "mitsuba>=3.8.0",
    "numpy>=2.4.6",
    "numpy-stl[fast]>=4.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "trimesh>=4.12.2",
    "rtree",
]

[dependency-groups]
dev = [
    "ipykernel<7",
    "marimo>=0.23.10",
    "ruff>=0.15.18",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
