[project]
name = "hac"
version = "0.1.0"
description = "Code related to the Helsinki Asteroid Challenge submissions by the team from the Technical University of Denmark (DTU)."
readme = "README.md"
authors = [
    { name = "Jeppe Klitgaard", email = "hi@jeppe.science" },
    { name = "Ishak Ayad", email = "ishak.ayad@centralesupelec.fr" },
    { name = "Christian Deding Nielsen", email = "cadni@dtu.dk"}
]
requires-python = ">=3.14"
dependencies = [
    "cholespy>=2.2.0",
    "cupy>=13.6.0",
    "imageio-ffmpeg>=0.6.0",
    "jax>=0.10.1",
    "matplotlib>=3.10.9",
    "mitsuba>=3.8.0",
    "numpy-stl[fast]>=4.0.0",
    "numpy>=2.4.6",
    "plotly>=6.9.0",
    "rtree>=1.4.1",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.0",
    "trimesh[recommend]>=4.12.2",
]

### Custom Mitsuba Configuration
# Comment out this if you want to use stock Mitsuba
# Note that this takes a _really_ long time to compile
# Consider running with `uv sync -v` to see the build output
[tool.uv]
config-settings-package = { mitsuba = { "cmake.define.MI_DEFAULT_VARIANTS" = "scalar_rgb,scalar_mono,cuda_ad_mono,llvm_ad_mono" } }

[tool.uv.sources]
mitsuba = { path = "vendored/mitsuba3" }
### End Custom Mitsuba Configuration

[dependency-groups]
dev = [
    "ipykernel<7",
    "marimo>=0.23.10",
    "ruff>=0.15.18",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
